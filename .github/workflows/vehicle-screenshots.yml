name: Period vehicle screenshots

on:
  pull_request:
    paths:
      - 'scripts/render/period_vehicles.gd'
      - 'scripts/render/model_lib.gd'
      - 'tests/test_period_vehicles.gd'
      - 'tools/capture_period_vehicles.gd'
      - '.github/workflows/vehicle-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vehicle-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Godot
        run: echo "GODOT=$(./tools/get_godot.sh)" >> "$GITHUB_ENV"
      - name: Software renderer and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
      - name: Import and source inventory
        run: |
          set -euo pipefail
          "$GODOT" --headless --import > import.log 2>&1
          if grep -Eq 'SCRIPT ERROR|Parse Error' import.log; then cat import.log; exit 1; fi
          "$GODOT" --headless --script res://tools/project_status.gd -- --check
      - name: Render period fleet and existing dealership
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tools/capture_period_vehicles.gd -- "$RUNNER_TEMP/vehicle-screenshots" 2>&1 | tee capture.log
          test "$(find "$RUNNER_TEMP/vehicle-screenshots" -name '*.png' | wc -l)" -eq 16
          test -s "$RUNNER_TEMP/vehicle-screenshots/13-existing-dealership.png"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Shader compilation failed' capture.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: period-vehicle-screenshots
          path: ${{ runner.temp }}/vehicle-screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-vehicle-capture-logs
          path: |
            capture.log
            import.log
