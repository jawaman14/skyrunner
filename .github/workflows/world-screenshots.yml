name: World scenery screenshots

on:
  pull_request:
    paths:
      - 'scripts/render/**'
      - 'shaders/**'
      - 'tools/capture_world_scenery.gd'
      - '.github/workflows/world-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: world-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Godot
        run: echo "GODOT=$(./tools/get_godot.sh)" >> "$GITHUB_ENV"
      - name: Software renderer and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
      - name: Import project
        run: |
          set -euo pipefail
          "$GODOT" --headless --import > import.log 2>&1
          if grep -Eq 'SCRIPT ERROR|Parse Error' import.log; then cat import.log; exit 1; fi
      - name: Capture updated world
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --path . --script res://tools/capture_world_scenery.gd -- "$RUNNER_TEMP/world-screenshots" 2>&1 | tee capture.log
          test -s "$RUNNER_TEMP/world-screenshots/01-club-tropicana.png"
          test -s "$RUNNER_TEMP/world-screenshots/06-street-coffee.png"
          test -s "$RUNNER_TEMP/world-screenshots/06-street-domino.png"
          if grep -Eq 'SCRIPT ERROR|Parse Error|Shader compilation failed' capture.log; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: world-scenery-screenshots
          path: ${{ runner.temp }}/world-screenshots/*.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: world-scenery-capture-logs
          path: |
            capture.log
            import.log
