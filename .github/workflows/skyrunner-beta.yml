name: Skyrunner beta builds

# Tests the Godot game, exports Linux / Windows / macOS builds and smoke-tests
# all three desktop targets. The builds are attached to the run as artifacts
# (Actions -> this run -> Artifacts). Pure GDScript: no compiler needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: skyrunner-beta-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2-stable
  GAME: .

jobs:
  mcp:
    name: MCP runtime (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "mcp>=2.3,<3" "httpx>=0.27"
      - run: python tools/mcp/test_guards.py tools/mcp/skyrunner_mcp.py
      - run: python tools/mcp/test_runtime.py
      - run: python tools/mcp/test_collaboration.py

  test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: logic, shard: "1/1", label: "test logic"}
          - {lane: simulation, shard: "1/3", label: "test 1/3"}
          - {lane: simulation, shard: "2/3", label: "test 2/3"}
          - {lane: simulation, shard: "3/3", label: "test 3/3"}
          - {lane: presentation, shard: "1/1", label: "test presentation"}
          - {lane: socket, shard: "1/1", label: "test socket"}
    steps:
      - uses: actions/checkout@v4
      - name: Repo hygiene
        run: bash tools/hygiene.sh
      - uses: actions/cache@v4
        with:
          path: .tools/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          key: godot-${{ runner.os }}-x64-${{ env.GODOT_VERSION }}
      - name: Godot
        run: echo "GODOT=$(${GAME}/tools/get_godot.sh)" >> "$GITHUB_ENV"
      - name: Test suite
        working-directory: ${{ env.GAME }}
        env:
          TEST_TIMEOUT: "2700"
          SHARD: ${{ matrix.shard }}
          TEST_LANE: ${{ matrix.lane }}
        run: ./tools/test.sh

  server:
    name: dedicated server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: echo "GODOT=$(${GAME}/tools/get_godot.sh)" >> "$GITHUB_ENV"
      - name: Import
        working-directory: ${{ env.GAME }}
        run: '"$GODOT" --headless --import >/dev/null 2>&1 || true'
      - name: Server from source answers and serves a seat
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          "$GODOT" --headless --path . --script res://scripts/net/dedicated.gd -- --port 47821 --password ci --seconds 90 --save /tmp/ci-server.json > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47821 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47821 | grep -q '"password":true'
          "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47821 --join boss --password ci | grep -q 'received a snapshot'
          if "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47821 --join boss >/dev/null 2>&1; then echo "joined without the password"; exit 1; fi
          cat /tmp/server.log | grep -a -v '^WARNING\|^ERROR\|^   at' || true
          ! grep -a 'SCRIPT ERROR' /tmp/server.log
      - name: The Docker image builds and runs
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          docker build -t skyrunner-server -f deploy/Dockerfile .
          docker run -d --name sr -p 47822:47800 -e SKYRUNNER_PASSWORD=ci skyrunner-server
          for i in $(seq 1 45); do
            if "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47822 >/dev/null 2>&1; then break; fi
            sleep 2
          done
          "$GODOT" --headless --path . --script res://tools/server_probe.gd -- 127.0.0.1 47822 --join boss --password ci | grep -q 'received a snapshot'
          docker stop -t 30 sr
          docker logs sr 2>&1 | grep -a 'saved; shutting down'

  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: echo "GODOT=$(${GAME}/tools/get_godot.sh)" >> "$GITHUB_ENV"
      - name: Export templates
        run: |
          set -euo pipefail
          D="$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          mkdir -p "$D"
          curl -sSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -oqj /tmp/templates.tpz templates/version.txt templates/linux_release.x86_64 \
            templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe \
            templates/macos.zip -d "$D"
          rm /tmp/templates.tpz
      - name: Export
        working-directory: ${{ env.GAME }}
        run: |
          set -euo pipefail
          "$GODOT" --headless --import >/dev/null 2>&1 || true
          mkdir -p export/linux export/windows export/macos
          "$GODOT" --headless --export-release Linux export/linux/Skyrunner.x86_64
          "$GODOT" --headless --export-release Windows export/windows/Skyrunner.exe
          "$GODOT" --headless --export-release macOS export/macos/Skyrunner.zip
          cp BETA.md export/linux/ && cp BETA.md export/windows/
          ls -la export/*
      - uses: actions/upload-artifact@v4
        with:
          name: skyrunner-linux
          path: ${{ env.GAME }}/export/linux
      - uses: actions/upload-artifact@v4
        with:
          name: skyrunner-windows
          path: ${{ env.GAME }}/export/windows
      - uses: actions/upload-artifact@v4
        with:
          name: skyrunner-macos
          path: |
            ${{ env.GAME }}/export/macos/Skyrunner.zip
            ${{ env.GAME }}/BETA.md

  smoke-linux:
    needs: export
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skyrunner-linux
          path: build
      - name: Mesa and a virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri >/dev/null
      - name: Headless run (the AI flies an open-mode game)
        run: |
          chmod +x build/Skyrunner.x86_64
          build/Skyrunner.x86_64 --headless -- --unlocks open --watch --new --smoke 1800 2>&1 | tee run.log
          grep -q "SMOKE OK" run.log
          ! grep -q "SCRIPT ERROR" run.log
      - name: Rendered frame (story mode, llvmpipe)
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" build/Skyrunner.x86_64 --rendering-driver opengl3 --audio-driver Dummy \
            -- --new --graphics low --hour 16 --shot "$PWD/smoke.png" --frames 240 2>&1 | tee shot.log
          test -s smoke.png
          ! grep -q "SCRIPT ERROR" shot.log
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-linux
          path: smoke.png

  smoke-windows:
    needs: export
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skyrunner-windows
          path: build
      - name: Headless run (the AI flies an open-mode game)
        shell: bash
        run: |
          build/Skyrunner.exe --headless -- --unlocks open --watch --new --smoke 1800 > run.log 2>&1 || true
          cat run.log
          grep -q "SMOKE OK" run.log
          ! grep -q "SCRIPT ERROR" run.log

  smoke-macos:
    needs: export
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skyrunner-macos
          path: build
      - name: Validate exported app bundle
        shell: bash
        run: |
          set -euo pipefail
          archive=$(find build -type f -name Skyrunner.zip -print -quit)
          test -n "$archive"
          ditto -x -k "$archive" build/unpacked
          app=$(find build/unpacked -maxdepth 2 -type d -name '*.app' -print -quit)
          test -n "$app"
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          binary="$app/Contents/MacOS/$executable"
          test -x "$binary"
          test -d "$app/Contents/Resources"
          if find "$app" -type d \( -name .git -o -name .godot -o -name sim-results \) | grep -q .; then
            echo 'Development directories found in release bundle'
            exit 1
          fi
          printf 'SKYRUNNER_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Headless run (the AI flies an open-mode game)
        shell: bash
        run: |
          set -euo pipefail
          "$SKYRUNNER_BINARY" --headless -- --unlocks open --watch --new --smoke 1800 > run.log 2>&1
          cat run.log
          grep -q 'SMOKE OK' run.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error' run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-log-macos
          path: run.log
          if-no-files-found: ignore
